<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ef" />
    <meta name="description" content="恋愛ロール向けのお題と補助条件をランダムに組み合わせるプロンプトルーレット" />
    <title>Prompt Roulette</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-glow page-glow--one" aria-hidden="true"></div>
    <div class="page-glow page-glow--two" aria-hidden="true"></div>

    <header class="site-header shell">
      <a class="brand" href="./" aria-label="Prompt Roulette トップ">
        <span class="brand-mark" aria-hidden="true"><span>♥</span></span>
        <span>
          <span class="eyebrow">DAILY ROLEPLAY PROMPTS</span>
          <span class="brand-title">Prompt Roulette</span>
        </span>
      </a>
      <span class="version" id="versionLabel">v0.1.0</span>
    </header>

    <main class="shell main-layout">
      <section class="roulette-panel" aria-labelledby="resultHeading">
        <div class="section-kicker">
          <span class="section-number">01</span>
          <span>MAIN PROMPT</span>
        </div>

        <article class="prompt-card" id="resultCard">
          <div class="prompt-card__topline">
            <span class="category-badge" id="categoryBadge">読み込み中</span>
            <div class="icon-actions">
              <button class="icon-button" id="rerollMainButton" type="button" aria-label="メインお題だけ引き直す" title="メインお題だけ引き直す">↻</button>
              <button class="icon-button favorite-toggle" id="favoriteButton" type="button" aria-label="現在のお題をお気に入りに保存" title="お気に入り">♡</button>
            </div>
          </div>
          <h1 class="prompt-text" id="resultHeading" aria-live="polite">お題を準備しています。</h1>
          <div class="tag-list" id="promptTags" aria-label="お題のタグ"></div>
        </article>

        <div class="section-kicker section-kicker--aux">
          <span class="section-number">02</span>
          <span>EXTRA CONDITIONS</span>
          <span class="count-pill" id="modifierCountLabel">4件</span>
        </div>

        <div class="modifier-list" id="modifierList" aria-live="polite"></div>

        <div class="primary-actions">
          <button class="roll-button" id="rollButton" type="button">
            <span class="roll-button__disc" aria-hidden="true">↻</span>
            <span>
              <span class="roll-button__main">ルーレットを回す</span>
              <span class="roll-button__sub">メインと補助条件をまとめて抽選</span>
            </span>
          </button>
          <button class="copy-button" id="copyButton" type="button">
            <span aria-hidden="true">▣</span>
            お題をコピー
          </button>
        </div>
        <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
      </section>

      <aside class="control-panel" aria-label="抽選設定">
        <div class="control-panel__header">
          <div>
            <span class="eyebrow">ROULETTE SETTINGS</span>
            <h2>抽選設定</h2>
          </div>
          <span class="data-count" id="dataCount"></span>
        </div>

        <details class="setting-block" open>
          <summary>
            <span>メインお題の種類</span>
            <span class="summary-note" id="categorySelectionCount"></span>
          </summary>
          <div class="setting-content">
            <div class="mini-actions">
              <button type="button" class="text-button" id="selectAllCategories">すべて選択</button>
              <button type="button" class="text-button" id="clearCategories">表示中だけ</button>
            </div>
            <div class="check-grid" id="categoryFilters"></div>
          </div>
        </details>

        <details class="setting-block" open>
          <summary>
            <span>補助条件</span>
            <span class="summary-note" id="modifierSelectionCount"></span>
          </summary>
          <div class="setting-content">
            <label class="range-row" for="modifierCount">
              <span>一度に表示する数</span>
              <span class="range-value" id="modifierRangeValue">4</span>
            </label>
            <input class="range-input" id="modifierCount" type="range" min="1" max="8" value="4" />
            <div class="check-grid check-grid--compact" id="modifierFilters"></div>
          </div>
        </details>

        <details class="setting-block">
          <summary>
            <span>抽選履歴</span>
            <span class="summary-note" id="historyCount">0件</span>
          </summary>
          <div class="saved-list" id="historyList"></div>
        </details>

        <details class="setting-block">
          <summary>
            <span>お気に入り</span>
            <span class="summary-note" id="favoriteCount">0件</span>
          </summary>
          <div class="saved-list" id="favoriteList"></div>
        </details>

        <button class="reset-button" id="resetSettingsButton" type="button">設定と履歴をリセット</button>
      </aside>
    </main>

    <footer class="site-footer shell">
      <p>ひとつの主題に、少しだけ偶然を。</p>
      <p>端末内にのみ設定・履歴・お気に入りを保存します。</p>
    </footer>

    <template id="modifierTemplate">
      <article class="modifier-card">
        <div>
          <span class="modifier-card__label"></span>
          <p class="modifier-card__value"></p>
        </div>
        <button class="icon-button modifier-card__reroll" type="button" aria-label="この補助条件だけ引き直す" title="この条件だけ引き直す">↻</button>
      </article>
    </template>

    <script src="prompts.js"></script>
    <script src="app.js"></script>
  </body>
</html>
